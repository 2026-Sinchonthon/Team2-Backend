# DB 전용. 로컬 개발과 EC2 운영 모두 이 파일로 mysql만 띄웁니다.
#   docker compose up -d      실행
#   docker compose down       중지 (데이터 유지)
#   docker compose down -v    중지 + 데이터 삭제 (스키마가 꼬였을 때)
#
# CI/CD 파이프라인에는 포함되지 않는 수동 1회성 작업입니다.
# 새 EC2 인스턴스를 띄울 때마다 SSH로 접속해서 직접 `docker compose up -d`를 실행해야 합니다.
#
# 127.0.0.1 로만 바인딩되어 외부에서 DB 포트로 직접 접근할 수 없습니다.
services:
  mysql:
    image: mysql:8.0
    container_name: sinchonthon-mysql
    restart: unless-stopped
    ports:
      - "127.0.0.1:3306:3306"   # 외부 노출 금지. 호스트(앱)에서만 접근합니다.
    environment:
      MYSQL_ROOT_PASSWORD: sinchonthon
      MYSQL_DATABASE: sinchonthon
      MYSQL_USER: sinchonthon
      MYSQL_PASSWORD: sinchonthon
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
