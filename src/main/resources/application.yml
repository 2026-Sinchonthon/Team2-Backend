spring:
  application:
    name: Team2-Backend
  profiles:
    default: local
  jpa:
    open-in-view: false

# 배포 시 CORS_ALLOWED_ORIGINS로 덮어쓰세요.
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

jwt:
  # 기본값을 두지 않습니다. dev/prod에서 JWT_SECRET을 빠뜨리면 부팅이 실패하도록 합니다.
  # (local 값은 application-local.yml)
  secret: ${JWT_SECRET}
  access-token-validity: 3600000  # 1시간 (ms)
