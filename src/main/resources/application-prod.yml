# EC2 운영용. 값은 /etc/team2-backend/app.env (systemd EnvironmentFile)에서 주입됩니다.
# 기본값은 EC2에 docker compose로 띄운 mysql(127.0.0.1:3306)과 동일합니다.
spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/sinchonthon?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${DB_USERNAME:sinchonthon}
    password: ${DB_PASSWORD:sinchonthon}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

server:
  # nginx가 HTTPS를 종료하고 앱에는 HTTP로 넘기는 구조라, 없으면 redirect_uri 등이
  # http://로 잘못 생성될 수 있습니다. (nginx 붙일 때 필요)
  forward-headers-strategy: framework
