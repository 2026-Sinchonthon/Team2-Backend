# 로컬 개발용. DB는 프로젝트 루트에서 `docker compose up -d`로 띄웁니다.
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/sinchonthon?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: sinchonthon
    password: sinchonthon
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      # update는 컬럼 삭제/이름 변경을 반영하지 않습니다.
      # 스키마가 꼬이면 `docker compose down -v && docker compose up -d`로 초기화하세요.
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
