name: Deploy to EC2

on:
  push:
    branches: [main]

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Build jar
        run: |
          chmod +x gradlew
          ./gradlew bootJar -x test --no-daemon

      - name: Ensure remote directories exist
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            mkdir -p /home/ubuntu/Team2-Backend/build/libs/staging /home/ubuntu/Team2-Backend/deploy

      - name: Upload new jar to staging
        uses: appleboy/scp-action@917f8b81dfc1ccd331fef9e2d61bdc6c8be94634 # v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "build/libs/*.jar"
          target: "/home/ubuntu/Team2-Backend/build/libs/staging/"
          strip_components: 2

      - name: Upload systemd unit file
        uses: appleboy/scp-action@917f8b81dfc1ccd331fef9e2d61bdc6c8be94634 # v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "deploy/team2-backend.service"
          target: "/home/ubuntu/Team2-Backend/deploy/"
          strip_components: 1

      - name: Swap in new jar, install unit file, restart, and health check
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            JAR=/home/ubuntu/Team2-Backend/build/libs/app.jar
            NEW_JAR=/home/ubuntu/Team2-Backend/build/libs/staging/app.jar

            # 전송이 중간에 끊기면 손상된 jar가 남을 수 있으므로, 백업·교체 전에 먼저 검증합니다.
            python3 -m zipfile -t "$NEW_JAR"

            # 지금 떠 있는 jar만 백업합니다(이미 서비스 중이므로 정상이라고 볼 수 있음).
            if [ -f "$JAR" ]; then
              cp "$JAR" "$JAR.bak"
            fi

            # 같은 파일시스템 내 mv는 원자적이라, 교체 도중 half-written 파일이 노출되지 않습니다.
            mv "$NEW_JAR" "$JAR"

            # 리포의 유닛 파일을 매 배포마다 실제 설치 위치에 반영합니다.
            sudo cp /home/ubuntu/Team2-Backend/deploy/team2-backend.service /etc/systemd/system/team2-backend.service
            sudo systemctl daemon-reload

            sudo systemctl restart team2-backend
            for i in $(seq 1 20); do
              if curl -sf http://localhost:8080/actuator/health > /dev/null; then
                echo "${{ github.sha }}" > /home/ubuntu/Team2-Backend/CURRENT_SHA
                echo "healthy"
                exit 0
              fi
              sleep 3
            done
            echo "헬스체크 실패 — 이전 버전으로 롤백합니다"
            if [ -f "$JAR.bak" ]; then
              cp "$JAR.bak" "$JAR"
              sudo systemctl restart team2-backend
            fi
            exit 1
