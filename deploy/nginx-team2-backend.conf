# EC2 배포 경로: /etc/nginx/sites-available/team2-backend (심볼릭 링크: /etc/nginx/sites-enabled/team2-backend)
# 설치 직후엔 HTTP만 있는 상태이고, Certbot을 돌리면 이 파일에 HTTPS 관련 설정이 자동으로 추가됩니다:
#   sudo certbot --nginx -d sinchon3ggi.cloud -d www.sinchon3ggi.cloud
server {
    listen 80;
    server_name sinchon3ggi.cloud www.sinchon3ggi.cloud;

    location / {
        proxy_pass http://localhost:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
